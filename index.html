  const ul = $("results");
  if (!hits.length) {
    ul.innerHTML = $("q").value.trim() ? `<li aria-disabled="true"><span>${t("no_results")}</span></li>` : "";
  } else {
    ul.innerHTML = hits.map((h, i) => `<li role="option" id="opt${i}" aria-selected="${i === active}"><span>${h.label.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])}</span><small>${t("kinds")[h.kind]}</small></li>`).join("");
  }
  const open = !!ul.innerHTML;
  ul.hidden = !open; $("q").setAttribute("aria-expanded", String(open));
  if (active >= 0) $("q").setAttribute("aria-activedescendant", "opt" + active); else $("q").removeAttribute("aria-activedescendant");
}
function closeResults() {
  hits = []; active = -1; $("results").innerHTML = ""; $("results").hidden = true;
  $("q").setAttribute("aria-expanded", "false"); $("q").removeAttribute("aria-activedescendant");
}
function goTo(lat, lng) {
  origin = L.latLng(lat, lng); marker.setLatLng(origin); fitNext = true; schedule();
}
function choose(i) {
  const h = hits[i]; if (!h) return;
  $("q").value = h.label; closeResults();
  goTo(h.lat, h.lon);
}
$("q").addEventListener("input", () => { if (!INDEX) buildIndex(); hits = search($("q").value); active = hits.length ? 0 : -1; renderResults(); });
$("q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && hits.length) { active = (active + 1) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && hits.length) { active = (active - 1 + hits.length) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === "Enter") { if (active >= 0) { choose(active); e.preventDefault(); $("q").blur(); } }
  else if (e.key === "Escape") closeResults();
});
$("results").addEventListener("mousedown", e => { const li = e.target.closest("li[role=option]"); if (li) { e.preventDefault(); choose(+li.id.slice(3)); } });
$("q").addEventListener("blur", () => setTimeout(closeResults, 150));

$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) { setStatus(t("loc_err"), "err"); return; }
  lastStatus = ["locating", "busy"]; setStatus(t("locating"), "busy");
  navigator.geolocation.getCurrentPosition(p => {
    lastStatus = null; setStatus("");
    const [W, S, E, N] = X.bbox, { latitude: la, longitude: lo } = p.coords;
    if (la < S || la > N || lo < W || lo > E) { lastStatus = ["loc_out", "err"]; setStatus(t("loc_out"), "err"); return; }
    goTo(la, lo);
  }, () => { lastStatus = ["loc_err", "err"]; setStatus(t("loc_err"), "err"); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

// ================= eventos =================
["minutes", "speed"].forEach(id => $(id).addEventListener("input", schedule));
["steps", "slope", "avoidSteep"].forEach(id => $(id).addEventListener("change", schedule));
$("maxGrade").addEventListener("input", () => { slopeLabels(); if ($("avoidSteep").checked) schedule(); else draw(); });
["showAm", "showSt", "showBn", "showBus", "showSteps", "showSteep"].forEach(id => $(id).addEventListener("change", draw));
map.on("click", e => { origin = e.latlng; marker.setLatLng(origin); schedule(); });
marker.on("drag", () => { origin = marker.getLatLng(); schedule(); });
map.on("moveend zoomend resize", () => { draw(); if (G) writeHash(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());   // rótulos con la tipografía buena

// ================= carga =================
applyLang();
lastStatus = ["loading", "busy"]; setStatus(t("loading"), "busy");
(async function load() {
  try {
    const [gBytes, xBytes, zBytes] = await Promise.all([fetchBytes("data/graph.bin.gz").then(gunzip), fetchBytes("data/extra.json.gz").then(gunzip),
      fetchBytes("data/elev.bin.gz").then(gunzip).catch(() => null)]);   // la elevación es opcional
    lastStatus = ["preparing", "busy"]; setStatus(t("preparing"), "busy");
    await new Promise(r => setTimeout(r, 0));
    G = parseGraph(gBytes); grid = buildGrid(G); EG = buildEdgeGrid(G);
    if (zBytes && zBytes.length === 2 * G.nN) { addElevation(G, new Int16Array(zBytes.buffer.slice(zBytes.byteOffset, zBytes.byteOffset + zBytes.byteLength))); map.attributionControl.addAttribution(t("elev_attr")); }
    else document.body.classList.add("noelev");
    X = JSON.parse(new TextDecoder().decode(xBytes));
    if (X.date) { const [y, m, d] = X.date.split("-"); DATA_DATE = `${d}/${m}/${y}`; $("limits").textContent = t("limits")(DATA_DATE); }
    const toRing = flat => { const m = new Float64Array(flat.length); let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let i = 0; i < flat.length; i += 2) { m[i] = mercX(flat[i] / 1e5); m[i + 1] = mercY(flat[i + 1] / 1e5); x0 = Math.min(x0, m[i]); x1 = Math.max(x1, m[i]); y0 = Math.min(y0, m[i + 1]); y1 = Math.max(y1, m[i + 1]); }
      return { m, x0, y0, x1, y1 }; };
    X.parks = X.parks.map(toRing); X.water = X.water.map(toRing);
    X.parkLabelsRaw = X.parkLabels;
    X.parkLabels = X.parkLabels.map((p, i) => [mercX(p[0] / 1e5), mercY(p[1] / 1e5), p[2], i]);
    const n = X.pois.length;
    POI = { n, cat: new Uint8Array(n), wc: new Uint8Array(n), name: new Uint32Array(n), lon: new Float64Array(n), lat: new Float64Array(n), mx: new Float64Array(n), my: new Float64Array(n), node: new Int32Array(n), snap: new Float32Array(n) };
    X.pois.forEach((p, i) => {
      const lon = p[0] / 1e5, lat = p[1] / 1e5, r = X.pn ? { node: X.pn[i], dist: X.pd[i] } : nearestNode(G, grid, lon, lat, 6);
      POI.cat[i] = p[2]; POI.wc[i] = p[3]; POI.name[i] = p[4]; POI.lon[i] = lon; POI.lat[i] = lat; POI.mx[i] = mercX(lon); POI.my[i] = mercY(lat);
      POI.node[i] = r.node; POI.snap[i] = r.node < 0 ? Infinity : r.dist;
    });
    POI.sty = new Uint8Array(n); for (const [i, ty] of X.sty || []) POI.sty[i] = ty;   // 1 Metro, 2 Cercanías, 3 Metro Ligero
    const ents = X.ent || [];   // bocas de metro: [lon e5, lat e5, wheelchair, estación, nodo, distancia m]
    ENT = { n: ents.length, wc: new Uint8Array(ents.length), node: new Int32Array(ents.length), snap: new Float32Array(ents.length), mx: new Float64Array(ents.length), my: new Float64Array(ents.length), byStation: new Map() };
    ents.forEach((en, k) => {
      ENT.wc[k] = en[2]; ENT.node[k] = en[4]; ENT.snap[k] = en[5]; ENT.mx[k] = mercX(en[0] / 1e5); ENT.my[k] = mercY(en[1] / 1e5);
      if (!ENT.byStation.has(en[3])) ENT.byStation.set(en[3], []); ENT.byStation.get(en[3]).push(k);
    });
    const [W, S, E, N] = X.bbox;
    map.setMaxBounds([[S - 0.02, W - 0.03], [N + 0.02, E + 0.03]]);
    const h = applyHash();
    marker.setLatLng(origin);
    if (h.hasPlace) map.setView(origin, h.zoom || 15, { animate: false }); else fitNext = true;
    lastStatus = null; setStatus("");
    $("q").disabled = false; $("locate").disabled = false;
    compute();
  } catch (err) {
    console.error(err);
    lastStatus = null; setStatus(t("load_err").replace("{e}", err.message), "err");
  }
})();
</script>
