    ctx.beginPath();
    for (let b = 0; b < G.nB; b++) { if (G.bk[b] !== kind) continue; const s = G.bst[b], e = G.bst[b + 1];
      ctx.moveTo(X_(G.bmx[s]), Y_(G.bmy[s])); for (let i = s + 1; i < e; i++) ctx.lineTo(X_(G.bmx[i]), Y_(G.bmy[i])); }
    if (kind === 3) { ctx.strokeStyle = THEME["map-water"]; ctx.lineWidth = Math.max(2, (z - 11) * 1.4); ctx.setLineDash([]); }
    if (kind === 2) { ctx.strokeStyle = THEME["map-rail"]; ctx.lineWidth = 1.2; ctx.setLineDash([5, 4]); }
    if (kind === 1) { ctx.strokeStyle = THEME["map-motor"]; ctx.lineWidth = Math.max(2, (z - 11) * 1.3); ctx.setLineDash([]); }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  // calles
  const pad = 40 / S, vis = visibleEdges(EG, vx0 - pad, vy0 - pad, vx1 + pad, vy1 + pad), isVis = e => EG.stamp[e] === EG.gen;
  const showMinor = z >= 14, wMinor = Math.max(1, (z - 13) * 1.6), wMajor = Math.max(1.6, (z - 12) * 1.9);
  const traceE = (e, rev) => { const p = edgePath(G, e, rev); ctx.moveTo(X_(p[0]), Y_(p[1])); for (let i = 2; i < p.length; i += 2) ctx.lineTo(X_(p[i]), Y_(p[i + 1])); };
  for (const pass of [0, 1]) for (const major of [0, 1]) {
    if (!major && !showMinor) continue;
    ctx.beginPath();
    for (const e of vis) if (((G.eflag[e] >> 1) & 1) === major) traceE(e, false);
    const w = major ? wMajor : wMinor;
    ctx.strokeStyle = pass === 0 ? THEME[major ? "map-major-edge" : "map-street-edge"] : THEME[major ? "map-major" : "map-street"];
    ctx.lineWidth = pass === 0 ? w + 1.5 : w; ctx.stroke();
  }

  // alcance
  if (state) {
    const width = Math.max(2, Math.min(6, 1.6 + (z - 12) * 0.6));
    const trace = it => { let p = edgePath(G, it.e, !it.fromLow); if (it.frac < 1) p = cutPath(p, it.frac);
      ctx.moveTo(X_(p[0]), Y_(p[1])); for (let i = 2; i < p.length; i += 2) ctx.lineTo(X_(p[i]), Y_(p[i + 1])); };
    const adjFrac = new Map(state.reachAdj.items.map(it => [it.e, it.frac]));
    ctx.beginPath(); ctx.strokeStyle = THEME.ref; ctx.lineWidth = Math.max(1.5, width * 0.75);
    for (const it of state.reachRef.items) if (isVis(it.e) && (adjFrac.get(it.e) || 0) < it.frac - 1e-6) trace(it);
    ctx.stroke();
    const bins = Array.from({ length: NB }, () => []);
    for (const it of state.reachAdj.items) if (isVis(it.e)) bins[Math.min(NB - 1, Math.floor(it.tt * NB))].push(it);
    ctx.lineWidth = width;
    bins.forEach((list, b) => { if (!list.length) return; ctx.beginPath(); ctx.strokeStyle = BIN_COLORS[b]; for (const it of list) trace(it); ctx.stroke(); });

    if ($("showSteps").checked) {   // tramos de escaleras dentro del alcance de referencia, en rojo
      ctx.beginPath(); ctx.strokeStyle = "#c1272d"; ctx.lineWidth = Math.max(2.5, width * 0.9);
      for (const it of state.reachRef.items) if ((G.eflag[it.e] & 1) && isVis(it.e)) traceE(it.e, false);
      ctx.stroke();
    }
    const showAm = $("showAm").checked, showSt = $("showSt").checked, showBn = $("showBn").checked, showBus = $("showBus").checked;
    const dotScale = z >= 15 ? 1 : z === 14 ? 0.7 : 0.5, stR = z >= 14 ? 7 : 5;
    for (let i = 0; i < POI.n; i++) {
      if (!state.inAdj[i]) continue;
      const c = POI.cat[i], x = X_(POI.mx[i]), y = Y_(POI.my[i]);
      if (x < -10 || y < -10 || x > size.x + 10 || y > size.y + 10) continue;
      if (c === 6) {
        if (!showSt) continue;
        const wc = POI.wc[i]; ctx.globalAlpha = !state.avoid || wc === 1 ? 1 : 0.35;
        ctx.beginPath(); ctx.arc(x, y, stR, 0, 6.2832); ctx.fillStyle = STATION_COLORS[wc]; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = "#15171a"; ctx.stroke(); ctx.globalAlpha = 1;
      } else if (c === 7 ? showBus : c === 5 ? showBn : showAm) {
        ctx.beginPath(); ctx.arc(x, y, (c === 5 ? 2.2 : 3) * dotScale, 0, 6.2832); ctx.fillStyle = CAT_COLORS[c]; ctx.globalAlpha = 0.9; ctx.fill(); ctx.globalAlpha = 1;
      }
    }
  }

  // rótulos: estaciones, parques y nombres de calle
  const boxes = [];
  const free = (x, y, w, h) => { for (const b of boxes) if (x < b[0] + b[2] && x + w > b[0] && y < b[1] + b[3] && y + h > b[1]) return false; boxes.push([x, y, w, h]); return true; };
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.lineJoin = "round";
  const label = (text, x, y, f, color, angle = 0) => {
    ctx.font = f; const w = ctx.measureText(text).width + 6, h = 14;
    const bw = Math.abs(Math.cos(angle)) * w + Math.abs(Math.sin(angle)) * h, bh = Math.abs(Math.sin(angle)) * w + Math.abs(Math.cos(angle)) * h;
    if (x - bw / 2 < 0 || y - bh / 2 < 0 || x + bw / 2 > size.x || y + bh / 2 > size.y || !free(x - bw / 2, y - bh / 2, bw, bh)) return;
    ctx.save(); ctx.translate(x, y); ctx.rotate(angle);
    ctx.strokeStyle = THEME["map-halo"]; ctx.lineWidth = 3.5; ctx.strokeText(text, 0, 0); ctx.fillStyle = color; ctx.fillText(text, 0, 0); ctx.restore();
  };
  const stDone = new Map();
  if (z >= 14) for (let i = 0; i < POI.n; i++) if (POI.cat[i] === 6 && POI.name[i]) {
    const x = X_(POI.mx[i]), y = Y_(POI.my[i]) - 14, nm = X.names[POI.name[i]], prev = stDone.get(nm);
    if (prev && Math.hypot(prev[0] - x, prev[1] - y) < 250) continue;
    if (x > 0 && y > 0 && x < size.x && y < size.y) { stDone.set(nm, [x, y]); label(nm, x, y, "600 12px " + font, THEME["map-label"]); }
  }
  for (const p of X.parkLabels) { const x = X_(p[0]), y = Y_(p[1]); if (x > 0 && y > 0 && x < size.x && y < size.y && (z >= 14 || p[3] < 20)) label(X.names[p[2]], x, y, "italic 12px " + font, THEME["map-park-label"]); }
  if (z >= 16) {
    const seen = new Set(), f = "11px " + font;
    const cand = vis.filter(e => G.en[e] && G.elen[e] > 45).sort((a, b) => G.elen[b] - G.elen[a]);
    for (const e of cand) {
      const nm = X.names[G.en[e]]; if (seen.has(nm)) continue;
      const p = edgePath(G, e, false); let bi = 2, bl = -1;
      for (let i = 2; i < p.length; i += 2) { const l = Math.hypot(p[i] - p[i - 2], p[i + 1] - p[i - 1]); if (l > bl) { bl = l; bi = i; } }
      const x0 = X_(p[bi - 2]), y0 = Y_(p[bi - 1]), x1 = X_(p[bi]), y1 = Y_(p[bi + 1]);
      ctx.font = f; if (Math.hypot(x1 - x0, y1 - y0) < ctx.measureText(nm).width + 10) continue;
      let a = Math.atan2(y1 - y0, x1 - x0); if (a > Math.PI / 2) a -= Math.PI; if (a < -Math.PI / 2) a += Math.PI;
      const before = boxes.length; label(nm, (x0 + x1) / 2, (y0 + y1) / 2, f, THEME["map-label"], a);
      if (boxes.length > before) seen.add(nm);
    }
  }
}

// ================= enlace con estado: los ajustes van en la dirección, tras el # =================
let hashTimer;
function writeHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const q = new URLSearchParams({ lat: origin.lat.toFixed(5), lng: origin.lng.toFixed(5), min: $("minutes").value,
      spd: (+$("speed").value).toFixed(2), st: $("steps").checked ? 1 : 0, z: map.getZoom(), lang: LANG });
    try { history.replaceState(null, "", "#" + q.toString()); } catch (e) { /* algunos navegadores lo limitan */ }
  }, 250);
}
function applyHash() {
  const num = (k, lo, hi) => { const v = parseFloat(qs.get(k)); return Number.isFinite(v) && v >= lo && v <= hi ? v : null; };
  const [W, S, E, N] = X.bbox;
  const lat = num("lat", S, N), lng = num("lng", W, E);
  if (lat !== null && lng !== null) origin = L.latLng(lat, lng);
  const m = num("min", 5, 30); if (m !== null) $("minutes").value = Math.round(m);
  const sp = num("spd", 0.8, 1.8); if (sp !== null) $("speed").value = sp;
  if (qs.get("st") === "1") $("steps").checked = true;
  labels();
  const z = num("z", 12, 19);
  return { hasPlace: lat !== null && lng !== null, zoom: z };
}
$("share").addEventListener("click", async () => {
  clearTimeout(hashTimer);
  const q = new URLSearchParams({ lat: origin.lat.toFixed(5), lng: origin.lng.toFixed(5), min: $("minutes").value,
    spd: (+$("speed").value).toFixed(2), st: $("steps").checked ? 1 : 0, z: map.getZoom(), lang: LANG });
  try { history.replaceState(null, "", "#" + q.toString()); } catch (e) { /* nada */ }
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title: document.title, text: t("share_text"), url }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  try { await navigator.clipboard.writeText(url); $("shareMsg").textContent = t("copied"); }
  catch (e) { $("shareMsg").textContent = t("copy_fail"); }
  setTimeout(() => { $("shareMsg").textContent = ""; }, 3000);
});

// ================= buscador (sin servidor: usa los nombres que vienen con los datos) =================
let INDEX = null, hits = [], active = -1;
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
function buildIndex() {
  const seen = new Map(), out = [];
  const add = (nameIdx, kind, lon, lat) => {
    const key = kind + ":" + norm(X.names[nameIdx]);
    if (seen.has(key)) return seen.get(key);
    const it = { label: X.names[nameIdx], n: norm(X.names[nameIdx]), kind, lon, lat, len: 0 };
    seen.set(key, it); out.push(it); return it;
  };
  for (let i = 0; i < POI.n; i++) if (POI.cat[i] === 6 && POI.name[i]) add(POI.name[i], 0, POI.lon[i], POI.lat[i]);
  for (const p of X.parkLabelsRaw) add(p[2], 1, p[0] / 1e5, p[1] / 1e5);
  for (let e = 0; e < G.nE; e++) {
    if (!G.en[e]) continue;
    const it = add(G.en[e], 2, 0, 0);
    if (G.elen[e] > it.len) { it.len = G.elen[e]; const u = G.eu[e], v = G.ev[e]; it.lon = (G.lon[u] + G.lon[v]) / 2; it.lat = (G.lat[u] + G.lat[v]) / 2; }
  }
  INDEX = out;
}
function search(q) {
  const words = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const res = [];
  for (const it of INDEX) {
    if (!words.every(w => it.n.includes(w))) continue;
    const i = it.n.indexOf(words[0]);
    const pos = i === 0 ? 0 : (i > 0 && /[\s\-'(]/.test(it.n[i - 1])) ? 1 : 2;
    res.push([pos, it.kind, it.n.length, it]);
  }
  res.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
  return res.slice(0, 8).map(r => r[3]);
}
function renderResults() {
  const ul = $("results");
  if (!hits.length) {
    ul.innerHTML = $("q").value.trim() ? `<li aria-disabled="true"><span>${t("no_results")}</span></li>` : "";
  } else {
    ul.innerHTML = hits.map((h, i) => `<li role="option" id="opt${i}" aria-selected="${i === active}"><span>${h.label.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c])}</span><small>${t("kinds")[h.kind]}</small></li>`).join("");
  }
  const open = !!ul.innerHTML;
  ul.hidden = !open; $("q").setAttribute("aria-expanded", String(open));
  if (active >= 0) $("q").setAttribute("aria-activedescendant", "opt" + active); else $("q").removeAttribute("aria-activedescendant");
}
function closeResults() {
  hits = []; active = -1; $("results").innerHTML = ""; $("results").hidden = true;
  $("q").setAttribute("aria-expanded", "false"); $("q").removeAttribute("aria-activedescendant");
}
function goTo(lat, lng) {
  origin = L.latLng(lat, lng); marker.setLatLng(origin); fitNext = true; schedule();
}
function choose(i) {
  const h = hits[i]; if (!h) return;
  $("q").value = h.label; closeResults();
  goTo(h.lat, h.lon);
}
$("q").addEventListener("input", () => { if (!INDEX) buildIndex(); hits = search($("q").value); active = hits.length ? 0 : -1; renderResults(); });
$("q").addEventListener("keydown", e => {
  if (e.key === "ArrowDown" && hits.length) { active = (active + 1) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === "ArrowUp" && hits.length) { active = (active - 1 + hits.length) % hits.length; renderResults(); e.preventDefault(); }
  else if (e.key === "Enter") { if (active >= 0) { choose(active); e.preventDefault(); $("q").blur(); } }
  else if (e.key === "Escape") closeResults();
});
$("results").addEventListener("mousedown", e => { const li = e.target.closest("li[role=option]"); if (li) { e.preventDefault(); choose(+li.id.slice(3)); } });
$("q").addEventListener("blur", () => setTimeout(closeResults, 150));

$("locate").addEventListener("click", () => {
  if (!navigator.geolocation) { setStatus(t("loc_err"), "err"); return; }
  lastStatus = ["locating", "busy"]; setStatus(t("locating"), "busy");
  navigator.geolocation.getCurrentPosition(p => {
    lastStatus = null; setStatus("");
    const [W, S, E, N] = X.bbox, { latitude: la, longitude: lo } = p.coords;
    if (la < S || la > N || lo < W || lo > E) { lastStatus = ["loc_out", "err"]; setStatus(t("loc_out"), "err"); return; }
    goTo(la, lo);
  }, () => { lastStatus = ["loc_err", "err"]; setStatus(t("loc_err"), "err"); }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

// ================= eventos =================
["minutes", "speed"].forEach(id => $(id).addEventListener("input", schedule));
$("steps").addEventListener("change", schedule);
["showAm", "showSt", "showBn", "showBus", "showSteps"].forEach(id => $(id).addEventListener("change", draw));
map.on("click", e => { origin = e.latlng; marker.setLatLng(origin); schedule(); });
marker.on("drag", () => { origin = marker.getLatLng(); schedule(); });
map.on("moveend zoomend resize", () => { draw(); if (G) writeHash(); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());   // rótulos con la tipografía buena

// ================= carga =================
applyLang();
lastStatus = ["loading", "busy"]; setStatus(t("loading"), "busy");
(async function load() {
  try {
    const [gBytes, xBytes] = await Promise.all([fetchBytes("data/graph.bin.gz").then(gunzip), fetchBytes("data/extra.json.gz").then(gunzip)]);
    lastStatus = ["preparing", "busy"]; setStatus(t("preparing"), "busy");
    await new Promise(r => setTimeout(r, 0));
    G = parseGraph(gBytes); grid = buildGrid(G); EG = buildEdgeGrid(G);
    X = JSON.parse(new TextDecoder().decode(xBytes));
    if (X.date) { const [y, m, d] = X.date.split("-"); DATA_DATE = `${d}/${m}/${y}`; $("limits").textContent = t("limits")(DATA_DATE); }
    const toRing = flat => { const m = new Float64Array(flat.length); let x0 = 1, y0 = 1, x1 = 0, y1 = 0;
      for (let i = 0; i < flat.length; i += 2) { m[i] = mercX(flat[i] / 1e5); m[i + 1] = mercY(flat[i + 1] / 1e5); x0 = Math.min(x0, m[i]); x1 = Math.max(x1, m[i]); y0 = Math.min(y0, m[i + 1]); y1 = Math.max(y1, m[i + 1]); }
      return { m, x0, y0, x1, y1 }; };
    X.parks = X.parks.map(toRing); X.water = X.water.map(toRing);
    X.parkLabelsRaw = X.parkLabels;
    X.parkLabels = X.parkLabels.map((p, i) => [mercX(p[0] / 1e5), mercY(p[1] / 1e5), p[2], i]);
    const n = X.pois.length;
    POI = { n, cat: new Uint8Array(n), wc: new Uint8Array(n), name: new Uint32Array(n), lon: new Float64Array(n), lat: new Float64Array(n), mx: new Float64Array(n), my: new Float64Array(n), node: new Int32Array(n), snap: new Float32Array(n) };
    X.pois.forEach((p, i) => {
      const lon = p[0] / 1e5, lat = p[1] / 1e5, r = X.pn ? { node: X.pn[i], dist: X.pd[i] } : nearestNode(G, grid, lon, lat, 6);
      POI.cat[i] = p[2]; POI.wc[i] = p[3]; POI.name[i] = p[4]; POI.lon[i] = lon; POI.lat[i] = lat; POI.mx[i] = mercX(lon); POI.my[i] = mercY(lat);
      POI.node[i] = r.node; POI.snap[i] = r.node < 0 ? Infinity : r.dist;
    });
    const [W, S, E, N] = X.bbox;
    map.setMaxBounds([[S - 0.02, W - 0.03], [N + 0.02, E + 0.03]]);
    const h = applyHash();
    marker.setLatLng(origin);
    if (h.hasPlace) map.setView(origin, h.zoom || 15, { animate: false }); else fitNext = true;
    lastStatus = null; setStatus("");
    $("q").disabled = false; $("locate").disabled = false;
    compute();
  } catch (err) {
    console.error(err);
    lastStatus = null; setStatus(t("load_err").replace("{e}", err.message), "err");
  }
})();
</script>
